# Two replicas each. MCP state lives in a pod's memory, A2A Tasks live in a pod's
# memory, and charge ignores its idempotency key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp }
  template:
    metadata:
      labels: { app: mcp }
    spec:
      containers:
        - name: mcp
          image: anm-communication:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: mcp }
            - { name: MCP_STATE, value: local-handle }
            - { name: IDEMPOTENCY, value: "off" }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector: { app: mcp }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a
spec:
  replicas: 2
  selector:
    matchLabels: { app: a2a }
  template:
    metadata:
      labels: { app: a2a }
    spec:
      containers:
        - name: a2a
          image: anm-communication:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: a2a }
            - { name: TASK_STORE, value: local }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: a2a
spec:
  selector: { app: a2a }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
spec:
  replicas: 1
  selector:
    matchLabels: { app: store }
  template:
    metadata:
      labels: { app: store }
    spec:
      containers:
        - name: store
          image: anm-communication:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: store }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: store
spec:
  selector: { app: store }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
    spec:
      containers:
        - name: client
          image: anm-communication:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: client }
