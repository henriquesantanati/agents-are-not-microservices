# Reference only. Karpenter cannot run on kind, so no script applies this file.
#
# terminationGracePeriod on the NodePool caps how long any pod can hold a node that is
# being disrupted, including pods annotated karpenter.sh/do-not-disrupt. Without it a
# single agent pod can block a node drain forever.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: agents
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
      expireAfter: 720h
      terminationGracePeriod: 3h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
