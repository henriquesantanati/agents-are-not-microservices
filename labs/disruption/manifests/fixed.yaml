# State outlives the pod. The preStop hook checkpoints, and the agent also checkpoints on
# SIGTERM and after every step (CHECKPOINT=all).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent
spec:
  maxUnavailable: 0
  selector:
    matchLabels: { app: agent }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent
spec:
  serviceName: agent
  replicas: 1
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
      annotations:
        karpenter.sh/do-not-disrupt: "2h" # protected 2h, then disruptable
    spec:
      terminationGracePeriodSeconds: 120  # 2 min to flush, not 30
      securityContext: { fsGroup: 65534 }
      containers:
        - name: agent
          image: anm-disruption:dev
          imagePullPolicy: Never
          lifecycle:
            preStop: { exec: { command: ["/app/checkpoint.sh"] } }
          env:
            - { name: CHECKPOINT, value: all }
            - { name: STEPS, value: "90" }
            - { name: STEP_SECONDS, value: "2" }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: state, mountPath: /state }
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 64Mi }
