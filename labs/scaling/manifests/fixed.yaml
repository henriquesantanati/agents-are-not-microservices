# The agent stays at one replica. The dependency scales on its own queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      containers:
        - name: agent
          image: anm-scaling:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: agent }
            - { name: FANOUT, value: "20" }
            - { name: DEPENDENCY_URL, value: "http://dependency" }
          ports:
            - containerPort: 8080
          resources:
            # The stub's Python HTTP client costs 30m to 70m at this load. 150m keeps the
            # HPA's percentage under its target on any machine, and three replicas of it
            # still fit on a small node next to KEDA and metrics-server.
            requests: { cpu: 150m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector: { app: agent }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency
spec:
  replicas: 1
  selector:
    matchLabels: { app: dependency }
  template:
    metadata:
      labels: { app: dependency }
    spec:
      containers:
        - name: dependency
          image: anm-scaling:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: dependency }
            - { name: CAPACITY, value: "4" }
            - { name: CALL_SECONDS, value: "0.2" }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dependency
spec:
  selector: { app: dependency }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: anm-scaling:dev
          imagePullPolicy: Never
          env:
            - { name: MODE, value: load }
            - { name: RATE, value: "2" }
            - { name: AGENT_URL, value: "http://agent" }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dependency
spec:
  scaleTargetRef: { name: dependency }
  minReplicaCount: 1
  maxReplicaCount: 3              # two replicas serve exactly the offered load, and a full queue does not drain
  triggers:
    - type: metrics-api           # the dependency's own queue, not the agent's CPU
      metadata:
        url: "http://dependency.scaling.svc.cluster.local/metrics"
        valueLocation: "dependency_queue_depth"
        targetValue: "10"
